services:
  # 1. Backend Web Service (Node.js Fastify + Prisma ORM)
  - type: web
    name: obras-jooy-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: obras-jooy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: https://obras-jooy.onrender.com
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123456
      - key: ADMIN_NOME
        value: Administrador do Sistema
      - key: FEATURE_ORCAMENTO_ENABLED
        value: "false"

  # 2. Frontend Static Site (React + Vite PWA)
  - type: web
    name: obras-jooy
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://obras-jooy-backend.onrender.com/api
      - key: VITE_FEATURE_ORCAMENTO
        value: "false"
      - key: VITE_EXIBIR_ACESSO_RAPIDO_TESTE
        value: "false"

databases:
  # 3. PostgreSQL Database
  - name: obras-jooy-db
    databaseName: obras_jooy
    user: almox
    plan: free
